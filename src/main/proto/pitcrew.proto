syntax = "proto3";

import "common.proto";
import "race-flag-status.proto";
import "lemon-pi.proto";

option optimize_for = LITE_RUNTIME;
option java_package = "com.normtronix.meringue";

// Admin Service for managing current races, connecting and
// disconnecting the race meta data for them.
service PitcrewService {

  rpc ping(Empty) returns (Empty);

  rpc auth(PitAuthRequest) returns (PitAuthResponse);

  rpc qrAuthAndReg(QrAuthRequest) returns (QrAuthResponse);

  rpc carAuth(CarAuthRequest) returns (CarAuthResponse);

  rpc getCarStatus(Empty) returns (PitCarStatusResponse);

  rpc sendDriverMessage(PitDriverMessageRequest) returns (BoolValue);

  rpc setTargetLapTime(PitSetTargetLapTimeRequest) returns (BoolValue);

  rpc resetFastLapTime(PitResetFastLapTimeRequest) returns (BoolValue);

  rpc setDriverName(PitSetDriverNameRequest) returns (BoolValue);

  rpc streamCarDataV2(PitCarDataRequest) returns (stream ToPitCrewMessage);

}

message PitAuthRequest {
  string username = 1;
  string teamCode = 2;
}

message PitAuthResponse {
  string bearerToken = 1;
}

message QrAuthRequest {
  string deviceId  = 1;
  string teamCode  = 2;
  string email     = 3;
  int64  timestamp = 4;  // unix epoch from QR — Meringue validates < 1hr old
}

message QrAuthResponse {
  string bearerToken = 1;
  string trackCode   = 2;
  string carNumber   = 3;
}

message PitDriverMessageRequest {
  string trackCode = 1;
  string carNumber = 2;
  string message = 3;
}

message PitResetFastLapTimeRequest {
  string trackCode = 1;
  string carNumber = 2;
}

message PitSetTargetLapTimeRequest {
  string trackCode = 1;
  string carNumber = 2;
  int32 targetTimeSeconds = 3;
}

message PitCarStatus {
  string carNumber = 1;
  string trackCode = 2;
  bool online = 3;
  string ipAddress = 4;
}

message PitCarStatusResponse {
  repeated PitCarStatus statusList = 1;
}

message PitSetDriverNameRequest {
  string trackCode = 1;
  string carNumber = 2;
  string driverName = 3;
}

message PitCarDataRequest {
  string trackCode = 1;
  string carNumber = 2;
  int64 sinceTimestamp = 3;  // replay messages with timestamp > sinceTimestamp before going live; 0 means full history
}

message PitCarData {
  string carNumber = 1;
  int64 timestamp = 2;
  RaceFlagStatus flagStatus = 3;
  int32 lapCount = 4;
  int32 position = 5;
  int32 positionInClass = 6;
  float lastLapTime = 7;
  string gap = 8;
  int32 coolantTemp = 9;
  int32 fuelRemainingPercent = 10;
  string driverMessage = 11;
  string carAhead = 12;
  string carBehind = 13;
  int32 fastestLap = 14;
  float fastestLapTime = 15;
  // extra sensors ... could be temp/pressure
  map<string, int32> extraSensors = 16;
  float avgLapTime = 17;
  float carAheadAvgLapTime = 18;
  float carBehindAvgLapTime = 19;
  string carBehindGap = 20;
}

message CarAuthRequest {
    string track_code = 1;
    string car_number = 2;
    string install_code = 3;  // the short hex shown in the app
}

message CarAuthResponse {
  string bearerToken = 1;
}

// the car is requesting to talk, or raising an alarm
message CarVoiceCallRequest {
  string trackCode = 1;
  string carNumber = 2;
  int32 timestamp = 3;
  // the driver raised an alarm from the button rather than asking for a chat.
  // Deprecated: the alarm is now a CarDriverSentMessage with empty text. Still set for
  // cars on apps up to 1.28 until those have aged out, then reserve 4.
  bool isEmergency = 4 [deprecated = true];
}

message CarConnectionStatus {
  string trackCode = 1;
  string carNumber = 2;
  bool isConnected = 3;
}

// the driver read and dismissed a message that was sent from the pits
message CarDriverMessageAck {
  string trackCode = 1;
  string carNumber = 2;
  int32 timestamp = 3;
  // the seq_num of the DriverMessage that was acknowledged
  int32 messageSeqNum = 4;
  // the text of the acknowledged message, so the pits can match it up
  string text = 5;
  DriverResponse response = 6;
}

// something the driver sent from the car. Empty text is a wave - the driver wants the
// pits' attention - otherwise it is what the driver said into the helmet mic, as text.
message CarDriverSentMessage {
  string trackCode = 1;
  string carNumber = 2;
  int32 timestamp = 3;
  // what the driver said, or empty for a wave
  string text = 4;
  // the seq_num of the DriverMessage this answers, or 0 when the driver spoke unprompted
  int32 inReplyTo = 5;
  // the text of the DriverMessage this answers, so the pits can match it up
  string inReplyToText = 6;
}

// how the driver talks to the pits, from the car's device telemetry. Sent when it is first
// known and whenever it changes, so the pit page can offer a chat when the driver can speak.
message CarCommsStatus {
  string trackCode = 1;
  string carNumber = 2;
  bool speechToTextEnabled = 3;
  // what speech to text records from: "helmet", "tablet", "none" - empty when it is off
  string micSource = 4;
}

message ToPitCrewMessage {
   int32 seq_num = 1;      // within-session counter, resets on restart — use for gap/duplicate detection only
   int64 timestamp = 7;   // wall-clock ms when Meringue emitted this message — use as replay cursor
   oneof to_pit_crew {
      EnteringPits pitting = 2;
      LeavingPits entering = 3;
      RaceStatus race_status = 4;
      PitCarData car_data = 5;
      SectorComplete sector_details = 6;
      // reserved 8;
      CarVoiceCallRequest call_request = 9;
      CarConnectionStatus connected_status = 10;
      CarDriverMessageAck message_ack = 11;
      CarDriverSentMessage driver_sent_message = 12;
      CarCommsStatus comms_status = 13;
   }
}

